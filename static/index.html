<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOTAM TW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #f3f5f8; --surface: #ffffff; --surface-2: #f7f8fa;
    --text: #0f1720; --text-2: #4a5563; --muted: #7b8594;
    --line: #e4e8ee; --grid: #eef1f5; --accent: #0a4ea2; --rain: #2a78d6;
    --err-bg: #fde8e8; --err-fg: #8a1c1c;
    --b-light: #e3effc; --b-light-fg: #1d5fa8;
    --b-rain: #c9defa; --b-rain-fg: #0f4489;
    --b-heavy: #1f5fbf; --b-heavy-fg: #ffffff;
    --b-wet: #fff1d6; --b-wet-fg: #8a5300;
    --b-hot: #fde2dc; --b-hot-fg: #a42a12;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0d1117; --surface: #161b22; --surface-2: #1c222b;
      --text: #eef1f5; --text-2: #b7c0cc; --muted: #8590a0;
      --line: #2a313c; --grid: #222934; --accent: #3987e5; --rain: #3987e5;
      --err-bg: #3a1616; --err-fg: #f3a5a5;
      --b-light: #16283f; --b-light-fg: #9cc4f2;
      --b-rain: #1d3a5f; --b-rain-fg: #c4dcfa;
      --b-heavy: #3987e5; --b-heavy-fg: #0d1117;
      --b-wet: #3a2a0e; --b-wet-fg: #f5c46b;
      --b-hot: #3d1a13; --b-hot-fg: #f7a28f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 Inter, system-ui, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  h1 span { color: var(--accent); }

  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  select { font: inherit; font-weight: 500; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 170px; cursor: pointer; }
  button { border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600; padding: 9px 18px; border-radius: 10px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .err { background: var(--err-bg); color: var(--err-fg); padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; }

  .wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .9rem; }
  th, td { padding: 9px 14px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { position: sticky; top: 0; background: var(--surface); color: var(--muted); font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  tr.rain td { background: color-mix(in srgb, var(--rain) 9%, transparent); }
  tr.rain td:first-child { box-shadow: inset 3px 0 var(--rain); }
  td.cond { text-align: left; }
  .tag { display: inline-block; padding: 2px 8px; margin: 1px 4px 1px 0; border-radius: 999px; font-size: .75rem; font-weight: 600; }
  .tag.light { background: var(--b-light); color: var(--b-light-fg); }
  .tag.rain  { background: var(--b-rain);  color: var(--b-rain-fg); }
  .tag.heavy { background: var(--b-heavy); color: var(--b-heavy-fg); }
  .tag.wet   { background: var(--b-wet);   color: var(--b-wet-fg); }
  .tag.hot   { background: var(--b-hot);   color: var(--b-hot-fg); }
  td.hot { color: var(--b-hot-fg); font-weight: 600; }
  .empty { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; color: var(--text-2); }
  tr.day td { background: var(--surface-2); color: var(--text-2); font-weight: 600; font-size: .8rem; }
</style>
</head>
<body>
<main>
  <h1>NOTAM <span>TW</span></h1>

  <div class="toolbar">
    <select id="location"></select>
    <button id="fetch">Consultar API</button>
  </div>

  <div id="out"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
const num = (v, d) => v == null ? "—" : Number(v).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtHour = t => new Date(t).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const fmtDay = t => new Date(t).toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "2-digit" });

// value de cada option = ID da location na Tomorrow.io
fetch("api/locations").then(r => r.json()).then(locs => {
  $("location").replaceChildren(...locs.map(l => el("option", { value: l.id, textContent: l.name })));
});

$("fetch").onclick = async () => {
  const btn = $("fetch"), out = $("out");
  btn.disabled = true; btn.textContent = "Carregando…";
  try {
    const r = await fetch(`api/forecast?location=${encodeURIComponent($("location").value)}`);
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    out.replaceChildren(table(j.hourly));
  } catch (err) {
    out.replaceChildren(el("div", { className: "err", textContent: "Erro: " + err.message }));
  } finally {
    btn.disabled = false; btn.textContent = "Consultar API";
  }
};

// Critérios (mm/h para intensidade, °C para temperatura)
function conditions(h) {
  const i = h.rain_intensity, t = h.temperature, tags = [];
  if (i >= 10) tags.push(["heavy", "Chuva forte"]);
  else if (i >= 2.6) tags.push(["rain", "Chuva"]);
  else if (i >= 0.5) tags.push(["light", "Chuva fraca"]);
  if (i > 3) tags.push(["wet", "Possibilidade de pista molhada"]);
  if (t > 34) tags.push(["hot", "Temperatura extrema"]);
  return tags;
}

function table(hourly) {
  const rows = [];
  let day = null;
  for (const h of hourly) {
    const tags = conditions(h);
    if (!tags.length) continue; // só horários com alguma condição
    const d = fmtDay(h.time);
    if (d !== day) { day = d; rows.push(el("tr", { className: "day" }, el("td", { colSpan: 4, textContent: d }))); }
    rows.push(el("tr", { className: h.rain_intensity >= 0.5 ? "rain" : "" },
      el("td", { textContent: fmtHour(h.time) }),
      el("td", { className: h.temperature > 34 ? "hot" : "", textContent: `${num(h.temperature, 1)} °C` }),
      el("td", { className: "cond" }, ...tags.map(([c, txt]) => el("span", { className: `tag ${c}`, textContent: txt }))),
      el("td", { textContent: `${num(h.precipitation_probability, 0)} %` })));
  }
  if (!rows.length) return el("div", { className: "empty", textContent: "Nenhum horário com chuva ou temperatura extrema na previsão." });
  return el("div", { className: "wrap" }, el("table", {},
    el("thead", {}, el("tr", {}, ...["Horário", "Temperatura", "Condições", "Prob. precipitação"].map(t => el("th", { textContent: t })))),
    el("tbody", {}, ...rows)));
}
</script>
</body>
</html>
