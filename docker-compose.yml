# Sobe o app na rede do Caddy (~/fortran), que repassa /weather/* para notam-tw:8000.
# A porta 8000 fica so no localhost do EC2 (para curl de diagnostico), nao publica.
services:
  notam-tw:
    build: .
    container_name: notam-tw
    restart: unless-stopped
    env_file: .env                  # TOMORROW_API_KEY (nao vai pro git)
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-fortran_default}   # rede do compose do Caddy; confira com `docker network ls`
